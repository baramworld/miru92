<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14161a">
<title>공성 신청</title>
<style>
:root{--bg:#f5f5f7;--card:#fff;--tx:#1b1d21;--sub:#6b7280;--line:#e3e5e9;--pri:#d63c3c;--ok:#1f9d55;--warn:#c47a00;--chip:#eceef2}
@media(prefers-color-scheme:dark){:root{--bg:#14161a;--card:#1d2026;--tx:#eceef2;--sub:#9aa1ad;--line:#2b2f37;--chip:#2a2e36;--ok:#3ecf80;--warn:#f0b04a}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:16px}
body{padding:env(safe-area-inset-top) 0 40px}
main{max-width:560px;margin:0 auto;padding:14px}
h1{font-size:20px;margin:6px 4px 2px}
h2{font-size:13px;color:var(--sub);margin:18px 4px 8px;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.sub{color:var(--sub);font-size:14px}
.row{display:flex;gap:8px;align-items:center}.row.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
input,select{width:100%;padding:13px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--tx);font-size:17px;font-family:inherit}
button{font-family:inherit;font-size:16px;border:0;border-radius:10px;padding:13px 16px;background:var(--chip);color:var(--tx);cursor:pointer}
.big{width:100%;padding:18px;font-size:19px;font-weight:800;margin-bottom:10px}
.b참여{background:var(--ok);color:#fff}
.b오픈{background:var(--warn);color:#fff}
.b불참{background:var(--chip);color:var(--tx)}
.big.on{outline:4px solid var(--pri);outline-offset:-4px}
.chip{padding:11px 16px;border-radius:999px;background:var(--chip);font-size:16px;border:0;cursor:pointer}
.chip.on{background:var(--pri);color:#fff;font-weight:700}
.hide{display:none!important}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#222;color:#fff;padding:13px 20px;border-radius:10px;font-size:15px;opacity:0;pointer-events:none;transition:.2s;z-index:9;max-width:92vw;text-align:center}
#toast.show{opacity:1}#toast.err{background:#b3261e}
.list .it{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px}
.list .it:last-child{border-bottom:0}
.tag{font-size:12px;padding:2px 8px;border-radius:6px;background:var(--chip);color:var(--sub)}
.tag.참여{background:var(--ok);color:#fff}
.tag.오픈{background:var(--warn);color:#fff}
.cnt{display:flex;gap:10px;margin-bottom:10px}
.cnt>div{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.cnt b{display:block;font-size:24px}
#busy{position:fixed;inset:0;background:rgba(0,0,0,.2);z-index:8;display:flex;align-items:center;justify-content:center}
#busy>div{background:var(--card);border:1px solid var(--line);padding:14px 24px;border-radius:12px;font-weight:700}
</style>
</head>
<body>
<main>
  <div id="closed" class="card hide">
    <h1 style="margin-top:0">지금은 신청을 받고 있지 않아요</h1>
    <p class="sub" style="margin-bottom:0">공성 모집이 열리면 다시 들어와 주세요.</p>
  </div>

  <div id="app" class="hide">
    <h1 id="rTitle"></h1>
    <div class="sub" id="rDate" style="margin:0 4px 12px"></div>

    <div class="cnt">
      <div><span class="sub">참여</span><b id="cJoin">0</b></div>
      <div><span class="sub">아이디 오픈</span><b id="cOpen">0</b></div>
      <div><span class="sub">불참</span><b id="cNo">0</b></div>
    </div>

    <div class="card">
      <h2 style="margin-top:0">내 캐릭</h2>
      <input id="name" list="names" placeholder="캐릭명 (예: 화무결)" autocomplete="off" oninput="onName()">
      <datalist id="names"></datalist>

      <div class="sub" style="margin:14px 0 6px">직업</div>
      <div class="row wrap" id="grpChips"></div>
      <input id="detail" placeholder="세부직업 (예: 진인, 검제) — 선택" style="margin-top:10px">

      <div id="mine" class="sub" style="margin-top:12px"></div>
    </div>

    <div class="card">
      <h2 style="margin-top:0">오늘 공성에</h2>
      <button class="big b참여" id="btn참여" onclick="send('참여')">참여해요</button>
      <button class="big b오픈" id="btn오픈" onclick="send('오픈')">못 가요 — 아이디는 오픈할게요</button>
      <button class="big b불참" id="btn불참" onclick="send('불참')">불참이에요</button>
      <div class="sub">잘못 눌렀으면 다시 눌러서 바꾸면 돼요.</div>
    </div>

    <h2>지금까지 신청한 사람</h2>
    <div class="card list" id="list"></div>
  </div>
</main>
<div id="toast"></div>
<div id="busy" class="hide"><div>보내는 중…</div></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const API = "https://script.google.com/macros/s/AKfycbw0M5R3wzrOh6fgey3lm6wpS0IhXS5pgaZXAWvHFxq6GNeB5d8XlcXge-uV6sIqwKcw/exec";
let D = { recruit: null, signups: [], roster: [], groups: ["격수","도사","도적","주술사"] };
let grp = "";

function toast(m, err) { const t = $("#toast"); t.textContent = m; t.className = "show" + (err ? " err" : ""); clearTimeout(toast.h); toast.h = setTimeout(() => t.className = "", 2600); }
function devId_() {
  let id; try { id = localStorage.getItem("dv"); } catch (e) {}
  if (!id) { id = Math.random().toString(36).slice(2, 10).toUpperCase(); try { localStorage.setItem("dv", id); } catch (e) {} }
  return id;
}
function remember(n) { try { localStorage.setItem("myname", n); } catch (e) {} }
function recall() { try { return localStorage.getItem("myname") || ""; } catch (e) { return ""; } }

async function load() {
  try {
    const r = await fetch(API + "?pub=1").then(r => r.json());
    if (!r.ok) return toast("불러오기 실패", 1);
    D = r.data; render();
  } catch (e) { toast("불러오기 실패 — 잠시 뒤 다시 열어주세요", 1); }
}

function render() {
  const open = !!D.recruit;
  $("#closed").classList.toggle("hide", open);
  $("#app").classList.toggle("hide", !open);
  if (!open) return;
  $("#rTitle").textContent = D.recruit.title || "공성 신청";
  $("#rDate").textContent = D.recruit.date ? D.recruit.date + " 공성" : "";

  const s = D.signups;
  $("#cJoin").textContent = s.filter(x => x.status === "참여").length;
  $("#cOpen").textContent = s.filter(x => x.status === "오픈").length;
  $("#cNo").textContent = s.filter(x => x.status === "불참").length;

  $("#names").innerHTML = D.roster.map(p => `<option value="${esc(p.name)}">`).join("");
  $("#grpChips").innerHTML = D.groups.map(g => `<button class="chip ${g === grp ? "on" : ""}" onclick="grp='${g}';render()">${g}</button>`).join("");

  const order = { "참여": 0, "오픈": 1, "불참": 2 };
  $("#list").innerHTML = s.length
    ? s.slice().sort((a, b) => (order[a.status] - order[b.status]) || a.name.localeCompare(b.name))
       .map(x => `<div class="it"><span class="tag ${esc(x.status)}">${esc(x.status)}</span><div class="grow">${esc(x.name)}${x.detail ? ` <span class="sub">(${esc(x.detail)})</span>` : ""}</div></div>`).join("")
    : `<div class="sub">아직 아무도 안 했어요</div>`;

  const me = mine();
  ["참여", "오픈", "불참"].forEach(k => $("#btn" + k).classList.toggle("on", !!me && me.status === k));
  $("#mine").innerHTML = me
    ? `지금 <b>${esc(me.status)}</b>${josa(me.status)} 되어 있어요.`
    : `아직 신청 안 했어요.`;
}
// 받침이 있으면 "으로", 없으면 "로"
function josa(w) {
  const c = String(w || "").slice(-1).charCodeAt(0);
  if (isNaN(c) || c < 0xAC00 || c > 0xD7A3) return "으로";
  const t = (c - 0xAC00) % 28;
  return (t === 0 || t === 8) ? "로" : "으로";
}
function mine() {
  const n = $("#name").value.trim();
  return n ? D.signups.find(x => x.name === n) : null;
}
function onName() {
  const n = $("#name").value.trim();
  const p = D.roster.find(x => x.name === n);
  if (p) { grp = p.group || grp; if (p.detail && !$("#detail").value.trim()) $("#detail").value = p.detail; }
  render();
}

async function send(status) {
  const name = $("#name").value.trim();
  if (!name) return toast("캐릭명을 먼저 적어 주세요", 1);
  if (status !== "불참" && !grp) return toast("직업을 골라 주세요", 1);
  $("#busy").classList.remove("hide");
  try {
    const r = await fetch(API, {
      method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action: "signup", name, group: grp, detail: $("#detail").value.trim(), status, dev: devId_() })
    }).then(r => r.json());
    if (!r.ok) return toast(r.error || "실패", 1);
    D = r.data; remember(name); render();
    toast(status === "오픈" ? "아이디 오픈으로 신청했어요. 고마워요!" : `${status}${josa(status)} 신청했어요`);
  } catch (e) { toast("보내기 실패 — 잠시 뒤 다시 해주세요", 1); }
  finally { $("#busy").classList.add("hide"); }
}

$("#name").value = recall();
load().then(() => { if ($("#name").value) onName(); });
</script>
</body>
</html>
